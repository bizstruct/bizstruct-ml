[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizstruct-ml"
version = "0.1.0"
description = "BizStruct ML Service — stateless business model generation worker"
requires-python = ">=3.12"
dependencies = [
    "azure-servicebus>=7.12.0",
    "azure-messaging-webpubsubservice>=1.1.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.0",
    "structlog>=24.2.0",
    "bizstruct-domain @ git+https://github.com/bizstruct/bizstruct-domain@v0.4.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bizstruct_ml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
