[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bizstruct-ml"
version = "0.1.0"
description = "BizStruct ML Service — stateless business model generation worker"
requires-python = ">=3.12"
dependencies = [
    "azure-servicebus>=7.12.0",
    "azure-messaging-webpubsubservice>=1.1.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "tenacity>=8.4.0",
    "structlog>=24.2.0",
    # TODO: switch to @v0.9.0 once bizstruct/bizstruct-domain PR #1 is merged
    # and the tag is pushed (data-quality fixes: NUL-byte sanitization,
    # max_length increases, and _uk/_en field removal). Pinned to that PR's
    # branch commit for now so this repo can actually pick the changes up
    # before the tag exists.
    "bizstruct-domain @ git+https://github.com/bizstruct/bizstruct-domain@bbee62baff73b4c40eadedc7a285274bf63b15c0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bizstruct_ml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Lets test_calibration.py import experiments.calibration.* directly
# (experiments/ isn't an installed package — it's dev tooling excluded
# from the worker's own Docker image, see Dockerfile — so it needs the
# repo root on sys.path the same way `python -m experiments.cli` gets it
# for free but pytest doesn't).
pythonpath = ["."]
